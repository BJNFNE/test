name: Nauz File Detector Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup CDiE
        uses: horsicq/gh_actions/nauz-file-detector@main

      - name: Check executable
        run: |          
          nfdc.exe ./Loader7.exe
